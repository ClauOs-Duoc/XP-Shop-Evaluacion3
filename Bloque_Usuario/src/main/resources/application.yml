spring:
  flyway:
    enabled: 'true'
    baseline-on-migrate: 'true'
  application:
    name: Bloque_Usuario
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ''
    username: root
    url: jdbc:mysql://localhost:3306/db_xp_shop_usuario?createDatabaseIfNotExist=true
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: 'true'
springdoc:
  swagger-ui:
    enabled: 'true'
    path: /doc/swagger-ui.html
  api-docs:
    enabled: 'true'
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
      
server:
  port: '0'