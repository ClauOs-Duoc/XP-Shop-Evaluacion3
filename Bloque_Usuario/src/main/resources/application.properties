spring.application.name=Bloque_Usuario
spring.profiles.active=dev
server.port=0
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


# Activar el Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html

# Configuración de Base de Datos (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/db_xp_shop_usuario?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA / Hibernate - Con Flyway desactivamos la creación automática de Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Activación de Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
