spring:
  main:
    web-application-type: servlet
  flyway:
    enabled: 'true'
    baseline-on-migrate: 'true'
  application:
    name: Bloque_Producto
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ''
    username: root
    url: jdbc:mysql://localhost:3306/db_xp_shop_productos?createDatabaseIfNotExist=true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: 'true'

springdoc:
  swagger-ui:
    enabled: 'true'
    path: /doc/swagger-ui.html
  api-docs:
    enabled: 'true'

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

server:
  port: '8082'
