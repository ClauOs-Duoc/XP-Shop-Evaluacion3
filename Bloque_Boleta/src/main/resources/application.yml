spring:
  application:
    name: Bloque_Boleta

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/db_xp_shop}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8081}

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
    path: /doc/swagger-ui.html